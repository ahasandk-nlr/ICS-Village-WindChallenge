<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Defcon Zones</title>
</head>
<body id="body" style="height: 100%; margin: 0;">
  <canvas id="canvas" width="2232" height="1684" style="height: 100vh;"></canvas>
  <!-- src is set by main.js from window.MAP_IMAGE (see /map-config.js,
       served by server.js) instead of a hardcoded filename here - lets
       the venue map (Las Vegas map.png vs Denver denMap.png) be switched
       with one env var instead of editing this file. -->
  <img id="map" style="display: none;" />

  <div id="side" style="background-color: lightgrey; float: right; height: 100vh;">
    <img src="nrel-logo-web.svg" style="min-width: auto;" />

    <!-- Zone rows are built by main.js from window.ZONES (see
         /zone-config.js, served by server.js) instead of being hardcoded
         here one per zone 1..16 - only zones something actually
         publishes to exist at all now, so this list grows/shrinks with
         ZONES instead of needing a matching HTML block added by hand. -->
    <div id="zoneList"></div>
  </div>

  <!-- Socket.IO client library -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Sets window.MAP_IMAGE / window.ZONES - must run before main.js -->
  <script src="/map-config.js"></script>
  <script src="/zone-config.js"></script>
  <!-- Your main logic in an external file -->
  <script src="main.js" defer></script>
</body>
</html>
